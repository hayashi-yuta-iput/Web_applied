<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>JavaScriptの練習</title>
  </head>
  <body>
    <p>ページ</p>
    <button onclick="myFunc();">Hello</button>
    <button onclick="changeColor('lightblue')">水色</button>
    <button onclick="changeColor('pink')">ピンク</button>
    <button onclick="changeColor('black')">黒</button>
    <script>
      function myFunc() {
        console.log("Hello");
      }
      function changeColor(color) {
    document.body.style.backgroundColor = color;
  }
    </script>
  </body>
</html>
